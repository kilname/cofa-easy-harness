name: Shell harness tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check harness structure
        run: sh doctor.sh
      - name: Test shell installer
        run: sh tests/test_harness.sh
